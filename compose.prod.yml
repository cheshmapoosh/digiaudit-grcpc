name: grcpc-prod

services:
  minio:
    image: ${MINIO_IMAGE:-minio/minio:RELEASE.2025-09-07T16-13-09Z}
    restart: unless-stopped
    command: server ${MINIO_DATA_DIR:-/var/lib/minio/data} --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-}
      MINIO_ROOT_USER_FILE: ${MINIO_ROOT_USER_FILE:-}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-}
      MINIO_ROOT_PASSWORD_FILE: ${MINIO_ROOT_PASSWORD_FILE:-}
    volumes:
      - minio_data:${MINIO_DATA_DIR:-/var/lib/minio/data}
      - "${GRCPC_SECRETS_DIR:-./secrets}:/run/secrets/grcpc:ro"
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:9000/minio/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  app:
    image: ${JAVA_IMAGE:-eclipse-temurin:21-jre-noble}
    restart: unless-stopped
    working_dir: /opt/grcpc
    depends_on:
      minio:
        condition: service_healthy
    volumes:
      - type: bind
        source: ${APP_JAR_PATH:-./grcpc-app.jar}
        target: /opt/grcpc/grcpc-app.jar
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./docker/app/entrypoint.sh
        target: /opt/grcpc/entrypoint.sh
        read_only: true
        bind:
          create_host_path: false
      - ./data/app/logs:/opt/grcpc/logs
      - "${GRCPC_SECRETS_DIR:-./secrets}:/run/secrets/grcpc:ro"
    environment:
      APP_JAR: /opt/grcpc/grcpc-app.jar
      SERVER_PORT: 8080
      SERVER_FORWARD_HEADERS_STRATEGY: framework
      DB_URL: ${DB_URL:?Set DB_URL for external Oracle}
      DB_USERNAME: ${DB_USERNAME:?Set DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD:-}
      DB_PASSWORD_FILE: ${DB_PASSWORD_FILE:-}
      DB_DRIVER_CLASS_NAME: ${DB_DRIVER_CLASS_NAME:-oracle.jdbc.OracleDriver}
      DB_SCHEMA: ${DB_SCHEMA:?Set DB_SCHEMA}
      FLYWAY_ENABLED: ${FLYWAY_ENABLED:-true}
      GRCPC_MINIO_ENABLED: ${GRCPC_MINIO_ENABLED:-${MINIO_ENABLED:-true}}
      GRCPC_MINIO_ENDPOINT: ${GRCPC_MINIO_ENDPOINT:-${MINIO_ENDPOINT:-http://minio:9000}}
      GRCPC_MINIO_PUBLIC_ENDPOINT: ${GRCPC_MINIO_PUBLIC_ENDPOINT:-${MINIO_PUBLIC_ENDPOINT:-${PUBLIC_SCHEME:-http}://${PUBLIC_HOST:-localhost}:${APP_PORT:-8080}}}
      GRCPC_MINIO_PRESIGN_REGION: ${GRCPC_MINIO_PRESIGN_REGION:-us-east-1}
      GRCPC_MINIO_ACCESS_KEY: ${GRCPC_MINIO_ACCESS_KEY:-}
      GRCPC_MINIO_ACCESS_KEY_FILE: ${GRCPC_MINIO_ACCESS_KEY_FILE:-}
      GRCPC_MINIO_SECRET_KEY: ${GRCPC_MINIO_SECRET_KEY:-}
      GRCPC_MINIO_SECRET_KEY_FILE: ${GRCPC_MINIO_SECRET_KEY_FILE:-}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-}
      MINIO_ACCESS_KEY_FILE: ${MINIO_ACCESS_KEY_FILE:-}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-}
      MINIO_SECRET_KEY_FILE: ${MINIO_SECRET_KEY_FILE:-}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-}
      MINIO_ROOT_USER_FILE: ${MINIO_ROOT_USER_FILE:-}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-}
      MINIO_ROOT_PASSWORD_FILE: ${MINIO_ROOT_PASSWORD_FILE:-}
      GRCPC_MINIO_BUCKET: ${GRCPC_MINIO_BUCKET:-${MINIO_BUCKET:-grc-documents}}
      GRCPC_MINIO_PRESIGNED_URL_EXPIRY_MINUTES: ${GRCPC_MINIO_PRESIGNED_URL_EXPIRY_MINUTES:-${MINIO_PRESIGNED_URL_EXPIRY_MINUTES:-15}}
      GRCPC_MINIO_DEFAULT_MAX_UPLOAD_SIZE_MB: ${GRCPC_MINIO_DEFAULT_MAX_UPLOAD_SIZE_MB:-${MINIO_DEFAULT_MAX_UPLOAD_SIZE_MB:-25}}
      GRCPC_MINIO_TEMP_TTL_MINUTES: ${GRCPC_MINIO_TEMP_TTL_MINUTES:-${MINIO_TEMP_TTL_MINUTES:-120}}
      GRCPC_MINIO_TEMPORARY_PREFIX: ${GRCPC_MINIO_TEMPORARY_PREFIX:-${MINIO_TEMPORARY_PREFIX:-master-data/document/temp}}
      GRCPC_MINIO_PERMANENT_PREFIX: ${GRCPC_MINIO_PERMANENT_PREFIX:-${MINIO_PERMANENT_PREFIX:-master-data/document/permanent}}
      GRCPC_MINIO_LIFECYCLE_MODE: ${GRCPC_MINIO_LIFECYCLE_MODE:-${MINIO_LIFECYCLE_MODE:-APPLY}}
      GRCPC_MINIO_TEMP_EXPIRATION_ENABLED: ${GRCPC_MINIO_TEMP_EXPIRATION_ENABLED:-${MINIO_TEMP_EXPIRATION_ENABLED:-true}}
      GRCPC_MINIO_TEMP_EXPIRATION_RULE_ID: ${GRCPC_MINIO_TEMP_EXPIRATION_RULE_ID:-${MINIO_TEMP_EXPIRATION_RULE_ID:-grcpc-temp-object-expiration}}
      GRCPC_MINIO_TEMP_EXPIRATION_DAYS: ${GRCPC_MINIO_TEMP_EXPIRATION_DAYS:-${MINIO_TEMP_EXPIRATION_DAYS:-2}}
      APP_LOGGING_PATH: ${APP_LOGGING_PATH:-/opt/grcpc/logs}
      JAVA_OPTS: ${JAVA_OPTS:--Xms512m -Xmx1024m}
    entrypoint: ["sh", "/opt/grcpc/entrypoint.sh"]

  nginx:
    image: ${NGINX_IMAGE:-nginx:1.28-alpine}
    restart: unless-stopped
    depends_on:
      - app
    environment:
      PUBLIC_HOST: ${PUBLIC_HOST:-localhost}
      PUBLIC_SCHEME: ${PUBLIC_SCHEME:-http}
      GRCPC_MINIO_BUCKET: ${GRCPC_MINIO_BUCKET:-${MINIO_BUCKET:-grc-documents}}
    ports:
      - "${APP_PORT:-8080}:8080"
    volumes:
      - type: bind
        source: ./docker/nginx/start.sh
        target: /opt/grcpc/start-nginx.sh
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${NGINX_TLS_DIR:-./tls}
        target: /etc/nginx/tls
        read_only: true
    entrypoint: ["sh", "/opt/grcpc/start-nginx.sh"]

volumes:
  minio_data:
    name: ${MINIO_VOLUME:-grcpc_prod_minio}
