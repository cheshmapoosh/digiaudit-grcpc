name: grcpc-test

services:
  oracle:
    image: ${ORACLE_IMAGE:-gvenzl/oracle-free:23-slim}
    container_name: grcpc-test-oracle
    restart: unless-stopped
    environment:
      ORACLE_PASSWORD: ${ORACLE_SYS_PASSWORD:-oracle}
      APP_USER: ${DB_USERNAME:-GRCPC}
      APP_USER_PASSWORD: ${DB_PASSWORD:-grcpc}
    ports:
      - "${ORACLE_PORT:-1521}:1521"
    volumes:
      - oracle-data:/opt/oracle/oradata
    healthcheck:
      test: ["CMD-SHELL", "healthcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 60
      start_period: 90s

  minio:
    image: ${MINIO_IMAGE:-minio/minio:RELEASE.2025-09-07T16-13-09Z}
    container_name: grcpc-test-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - type: bind
        source: ./data/minio
        target: /data

    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:9000/minio/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  app:
    image: ${JAVA_IMAGE:-eclipse-temurin:21-jre-noble}
    container_name: grcpc-test-app
    restart: unless-stopped
    working_dir: /opt/grcpc
    depends_on:
      oracle:
        condition: service_healthy
      minio:
        condition: service_healthy
    volumes:
      - type: bind
        source: ./grcpc-app.jar
        target: /opt/grcpc/grcpc-app.jar
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./data/app/logs
        target: /opt/grcpc/logs
    environment:
      SERVER_PORT: 8080

      DB_URL: ${DB_URL:-jdbc:oracle:thin:@//oracle:1521/FREEPDB1}
      DB_USERNAME: ${DB_USERNAME:-GRCPC}
      DB_PASSWORD: ${DB_PASSWORD:-grcpc}
      DB_DRIVER_CLASS_NAME: oracle.jdbc.OracleDriver
      DB_SCHEMA: ${DB_SCHEMA:-${DB_USERNAME:-GRCPC}}
      FLYWAY_ENABLED: "true"

      GRCPC_MINIO_ENABLED: "true"
      GRCPC_MINIO_ENDPOINT: http://minio:9000
      GRCPC_MINIO_PUBLIC_ENDPOINT: ${GRCPC_MINIO_PUBLIC_ENDPOINT:-http://${PUBLIC_HOST:-localhost}:${MINIO_API_PORT:-9000}}
      GRCPC_MINIO_PRESIGN_REGION: ${GRCPC_MINIO_PRESIGN_REGION:-us-east-1}
      GRCPC_MINIO_ACCESS_KEY: ${GRCPC_MINIO_ACCESS_KEY:-${MINIO_ROOT_USER:-minioadmin}}
      GRCPC_MINIO_SECRET_KEY: ${GRCPC_MINIO_SECRET_KEY:-${MINIO_ROOT_PASSWORD:-minioadmin}}
      GRCPC_MINIO_BUCKET: ${GRCPC_MINIO_BUCKET:-grc-documents}
      GRCPC_MINIO_PRESIGNED_URL_EXPIRY_MINUTES: "15"
      GRCPC_MINIO_DEFAULT_MAX_UPLOAD_SIZE_MB: "25"
      GRCPC_MINIO_TEMP_TTL_MINUTES: "120"
      GRCPC_MINIO_TEMPORARY_PREFIX: master-data/document/temp
      GRCPC_MINIO_PERMANENT_PREFIX: master-data/document/permanent
      GRCPC_MINIO_LIFECYCLE_MODE: APPLY
      GRCPC_MINIO_TEMP_EXPIRATION_ENABLED: "true"
      GRCPC_MINIO_TEMP_EXPIRATION_RULE_ID: grcpc-temp-object-expiration
      GRCPC_MINIO_TEMP_EXPIRATION_DAYS: "2"

      APP_LOGGING_PATH: /opt/grcpc/logs
      ROOT_LOG_LEVEL: INFO
      APP_LOG_LEVEL: DEBUG
      JAVA_OPTS: -Xms256m -Xmx512m
    ports:
      - "8080:8080"
    command: ["sh", "-c", "exec java $${JAVA_OPTS:-} -jar /opt/grcpc/grcpc-app.jar"]

volumes:
  oracle-data:
