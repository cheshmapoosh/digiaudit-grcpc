spring:
  application:
    name: grcpc-api

  servlet:
    multipart:
      max-file-size: ${DOCUMENT_MULTIPART_MAX_FILE_SIZE:100MB}
      max-request-size: ${DOCUMENT_MULTIPART_MAX_REQUEST_SIZE:100MB}

  datasource:
    url: ${DB_URL:jdbc:oracle:thin:@//localhost:1521/FREEPDB1}
    username: ${DB_USERNAME:GRCPC}
    password: ${DB_PASSWORD:grcpc}
    driver-class-name: ${DB_DRIVER_CLASS_NAME:oracle.jdbc.OracleDriver}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        default_schema: ${DB_SCHEMA:GRCPC}
        type:
          preferred_uuid_jdbc_type: VARCHAR

  flyway:
    enabled: ${FLYWAY_ENABLED:true}
    default-schema: ${DB_SCHEMA:GRCPC}
    schemas: ${DB_SCHEMA:GRCPC}
    locations: classpath:db/migration/common,classpath:db/migration/oracle
    baseline-on-migrate: true

server:
  port: ${SERVER_PORT:8080}

app:
  logging:
    path: ${APP_LOGGING_PATH:logs}
  master-data:
    hierarchy-lock-timeout-ms: ${MASTER_DATA_HIERARCHY_LOCK_TIMEOUT_MS:5000}
  minio:
    enabled: ${GRCPC_MINIO_ENABLED:true}
    endpoint: ${GRCPC_MINIO_ENDPOINT:http://localhost:9000}
    public-endpoint: ${GRCPC_MINIO_PUBLIC_ENDPOINT:http://localhost:9000}
    access-key: ${GRCPC_MINIO_ACCESS_KEY:minioadmin}
    secret-key: ${GRCPC_MINIO_SECRET_KEY:minioadmin}
    bucket: ${GRCPC_MINIO_BUCKET:grc-documents}
    presigned-url-expiry-minutes: ${GRCPC_MINIO_PRESIGNED_URL_EXPIRY_MINUTES:15}
    default-max-upload-size-mb: ${GRCPC_MINIO_DEFAULT_MAX_UPLOAD_SIZE_MB:25}
    temp-ttl-minutes: ${GRCPC_MINIO_TEMP_TTL_MINUTES:120}
    temporary-prefix: ${GRCPC_MINIO_TEMPORARY_PREFIX:master-data/document/temp}
    permanent-prefix: ${GRCPC_MINIO_PERMANENT_PREFIX:master-data/document/permanent}
    lifecycle:
      mode: ${GRCPC_MINIO_LIFECYCLE_MODE:APPLY}
      temp-expiration:
        enabled: ${GRCPC_MINIO_TEMP_EXPIRATION_ENABLED:true}
        rule-id: ${GRCPC_MINIO_TEMP_EXPIRATION_RULE_ID:grcpc-temp-object-expiration}
        expire-days: ${GRCPC_MINIO_TEMP_EXPIRATION_DAYS:2}
      incomplete-multipart:
        enabled: ${GRCPC_MINIO_INCOMPLETE_MULTIPART_ENABLED:true}
        rule-id: ${GRCPC_MINIO_INCOMPLETE_MULTIPART_RULE_ID:grcpc-temp-incomplete-multipart-cleanup}
        abort-after-days: ${GRCPC_MINIO_INCOMPLETE_MULTIPART_ABORT_AFTER_DAYS:1}

logging:
  level:
    root: ${ROOT_LOG_LEVEL:INFO}
    com.digiaudit.grcpc: ${APP_LOG_LEVEL:DEBUG}
