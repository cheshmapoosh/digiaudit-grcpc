name: grcpc-stage

# Keep this file, stage.env and grcpc-app.jar in the same deployment directory.
# Bind paths are relative to this file, including persistent data/minio.
services:
  minio:
    image: ${MINIO_IMAGE:-minio/minio:RELEASE.2025-09-07T16-13-09Z}
    pull_policy: never
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER in stage.env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in stage.env}
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - type: bind
        source: ./data/minio
        target: /data
        bind:
          create_host_path: true
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:9000/minio/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  app:
    image: ${JAVA_IMAGE:-eclipse-temurin:21-jre-noble}
    pull_policy: never
    restart: unless-stopped
    working_dir: /opt/grcpc
    depends_on:
      minio:
        condition: service_healthy
    volumes:
      - type: bind
        source: ./grcpc-app.jar
        target: /opt/grcpc/grcpc-app.jar
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./data/app/logs
        target: /opt/grcpc/logs
        bind:
          create_host_path: true
    environment:
      SERVER_PORT: 8080
      DB_URL: ${DB_URL:?Set DB_URL for external Oracle in stage.env}
      DB_USERNAME: ${DB_USERNAME:?Set DB_USERNAME in stage.env}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in stage.env}
      DB_DRIVER_CLASS_NAME: oracle.jdbc.OracleDriver
      DB_SCHEMA: ${DB_SCHEMA:?Set DB_SCHEMA in stage.env}
      FLYWAY_ENABLED: ${FLYWAY_ENABLED:-true}

      GRCPC_MINIO_ENABLED: "true"
      GRCPC_MINIO_ENDPOINT: http://minio:9000
      GRCPC_MINIO_PUBLIC_ENDPOINT: ${GRCPC_MINIO_PUBLIC_ENDPOINT:?Set the browser-reachable MinIO URL in stage.env}
      GRCPC_MINIO_ACCESS_KEY: ${GRCPC_MINIO_ACCESS_KEY:-${MINIO_ROOT_USER:?Set MINIO_ROOT_USER in stage.env}}
      GRCPC_MINIO_SECRET_KEY: ${GRCPC_MINIO_SECRET_KEY:-${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in stage.env}}
      GRCPC_MINIO_BUCKET: ${GRCPC_MINIO_BUCKET:-grc-documents}
      GRCPC_MINIO_PRESIGNED_URL_EXPIRY_MINUTES: ${GRCPC_MINIO_PRESIGNED_URL_EXPIRY_MINUTES:-15}
      GRCPC_MINIO_DEFAULT_MAX_UPLOAD_SIZE_MB: ${GRCPC_MINIO_DEFAULT_MAX_UPLOAD_SIZE_MB:-25}
      GRCPC_MINIO_TEMP_TTL_MINUTES: ${GRCPC_MINIO_TEMP_TTL_MINUTES:-120}
      GRCPC_MINIO_TEMPORARY_PREFIX: ${GRCPC_MINIO_TEMPORARY_PREFIX:-master-data/document/temp}
      GRCPC_MINIO_PERMANENT_PREFIX: ${GRCPC_MINIO_PERMANENT_PREFIX:-master-data/document/permanent}
      GRCPC_MINIO_LIFECYCLE_MODE: ${GRCPC_MINIO_LIFECYCLE_MODE:-APPLY}
      GRCPC_MINIO_TEMP_EXPIRATION_ENABLED: ${GRCPC_MINIO_TEMP_EXPIRATION_ENABLED:-true}
      GRCPC_MINIO_TEMP_EXPIRATION_RULE_ID: ${GRCPC_MINIO_TEMP_EXPIRATION_RULE_ID:-grcpc-temp-object-expiration}
      GRCPC_MINIO_TEMP_EXPIRATION_DAYS: ${GRCPC_MINIO_TEMP_EXPIRATION_DAYS:-2}

      APP_LOGGING_PATH: /opt/grcpc/logs
      ROOT_LOG_LEVEL: ${ROOT_LOG_LEVEL:-INFO}
      APP_LOG_LEVEL: ${APP_LOG_LEVEL:-INFO}
      JAVA_OPTS: ${JAVA_OPTS:--Xms512m -Xmx1024m}
    ports:
      - "${APP_PORT:-8080}:8080"
    command: ["sh", "-c", "exec java $${JAVA_OPTS:-} -jar /opt/grcpc/grcpc-app.jar"]
